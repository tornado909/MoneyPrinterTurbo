# Compatibility overlay.
#
# Chatterbox GPU inference is now owned by ASC-AI's speech-tts service and GPU
# Scheduler. This file intentionally does not start a second CPU TTS server.
# Keep it in existing deployment commands while migrating; docker-compose.asc-ai.yml
# attaches webui/api to the ASC-AI network where speech-tts is reachable.
services:
  webui:
    environment:
      MPT_CHATTERBOX_BASE_URL: http://speech-tts:8097/v1

  api:
    environment:
      MPT_CHATTERBOX_BASE_URL: http://speech-tts:8097/v1
